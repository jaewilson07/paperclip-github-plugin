name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Superseded PR heads are cancelled; a run on main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          standalone: true
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The only check branch protection and safe_merge.py need to require. Adding or
  # renaming a job above never touches branch protection again. This repo is
  # public, so it stays on GitHub-hosted runners (never self-hosted: fork PRs).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A CI job failed or was cancelled."
            exit 1
          fi
